plugins {
    id 'java'
    id 'groovy'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'signing'
    id 'com.github.spotbugs' version '6.5.4'
    id 'org.owasp.dependencycheck' version '12.2.1'
    id 'com.gradleup.nmcp' version '1.5.0'
    id 'com.gradleup.nmcp.aggregation' version '1.5.0'
}

group = "com.toastcoders"
base.archivesName = "yavijava"
version = '9.0.2'
ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.dom4j:dom4j:2.1.4'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    testImplementation 'ch.qos.logback:logback-classic:1.5.32'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.5.2'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testImplementation 'javax.servlet:javax.servlet-api:3.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testImplementation 'org.apache.groovy:groovy-all:4.0.24'
    testImplementation 'net.bytebuddy:byte-buddy:1.17.5'
    testRuntimeOnly 'org.objenesis:objenesis:3.4'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.13.0'
}

sourceSets {
    main {
        java {
        }
    }

    intTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
        groovy {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
    }

    test {
        java {
        }
        groovy {
        }
    }
}

configurations {
    intTestImplementation.extendsFrom testImplementation
    intTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task intTest(type: Test) {
    description = "Run integration tests (located in src/intTest/...)."
    testClassesDirs = project.sourceSets.intTest.output.classesDirs
    classpath = project.sourceSets.intTest.runtimeClasspath
    useJUnitPlatform()
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
}

test {
    useJUnitPlatform()
    // Needed for XmlGenDom to set detailMessage on JDK exception classes via reflection
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    testLogging {
        events 'started', 'passed', 'failed'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withJavadocJar()
    withSourcesJar()
}

javadoc {
    options.addBooleanOption('Xdoclint:none', true)
}

// --- SpotBugs static analysis (runs as part of `check`) ---
spotbugs {
    ignoreFailures = false
    effort = com.github.spotbugs.snom.Effort.MAX
    excludeFilter = file('config/spotbugs/exclude.xml')
}

spotbugsMain {
    reports {
        html.required = true
        text.required = true
        xml.required = false
    }
}

// Test/intTest sources are not gated — too much noise for minimal benefit.
spotbugsTest.enabled = false
spotbugsIntTest.enabled = false

// Force log4j to a version that fixes CVE-2026-34478, CVE-2026-34480, CVE-2026-34481,
// and CVE-2025-68161. SpotBugs pulls in 2.25.2; 2.25.4 is within its [2.17.1,3) range.
configurations.all {
    resolutionStrategy {
        force 'org.apache.logging.log4j:log4j-core:2.25.4'
        force 'org.apache.logging.log4j:log4j-api:2.25.4'
    }
}

// --- OWASP Dependency-Check (run explicitly: ./gradlew dependencyCheckAnalyze) ---
// Not wired into `check` because it requires downloading the NVD database (~200 MB).
// Run periodically in CI as a separate job.
// Provide NVD API key via -PnvdApiKey=<key> or gradle.properties for higher rate limits.
dependencyCheck {
    failBuildOnCVSS = 7
    suppressionFile = 'config/owasp/suppressions.xml'
    nvd {
        apiKey = findProperty('nvdApiKey') ?: ''
    }
}

signing {
    required = isReleaseVersion
    def signingKey = findProperty('signingKey')
    def signingKeyId = findProperty('signingKeyId')
    def signingPassword = findProperty('signingPassword')
    if (signingKey) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }
    sign publishing.publications
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'yavijava'
            from components.java

            pom {
                name = 'yavijava'
                packaging = 'jar'
                description = 'Java library for VMware vSphere'
                url = 'https://github.com/yavijava/yavijava'

                scm {
                    connection = 'scm:git:https://github.com/yavijava/yavijava.git'
                    developerConnection = 'scm:git:https://github.com/yavijava/yavijava.git'
                    url = 'https://github.com/yavijava/yavijava'
                }

                licenses {
                    license {
                        name = 'BSD'
                        url = 'http://opensource.org/licenses/BSD-3-Clause'
                    }
                }

                developers {
                    developer {
                        id = 'michaelrice'
                        name = 'Michael Rice'
                        email = 'michael@michaelrice.org'
                    }
                }
            }
        }
    }
}

nmcpAggregation {
    centralPortal {
        username = findProperty('mavenCentralUsername') ?: ''
        password = findProperty('mavenCentralPassword') ?: ''
        publishingType = "AUTOMATIC"
    }
}

dependencies {
    nmcpAggregation project(':')
}
